[workspace]
members = [
  "crates/hid-usage-tables",
  "crates/hidder",
  "crates/hidder-core",
  "crates/hidder-dsl",
  "crates/hidder-macros",
  "crates/hidder-parser",
  "xtask",
]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85"
license      = "MIT OR Apache-2.0"
authors      = [ "loncothad (loncothad@gmail.com)" ]
repository   = "https://github.com/loncothad/hidder"
homepage     = "https://github.com/loncothad/hidder"
keywords     = [ "embedded", "hid", "no-std", "parser", "usb" ]
categories   = [ "embedded", "no-std", "parser-implementations" ]
publish      = true

[workspace.dependencies]
hidder-core      = { path = "crates/hidder-core", version = "0.1.0" }
hid-usage-tables = { path = "crates/hid-usage-tables", version = "0.1.0" }
hidder-dsl       = { path = "crates/hidder-dsl", version = "0.1.0" }
hidder-macros    = { path = "crates/hidder-macros", version = "0.1.0" }
hidder-parser    = { path = "crates/hidder-parser", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# HID packing, generated hex IDs, and SHA-256 constants.
unreadable_literal            = "allow"
cast_possible_truncation      = "allow"
cast_possible_wrap            = "allow"
cast_sign_loss                = "allow"
checked_conversions           = "allow"
too_many_lines                = "allow"
many_single_char_names        = "allow"
module_name_repetitions       = "allow"
doc_markdown                  = "allow"
enum_variant_names            = "allow"
semicolon_if_nothing_returned = "allow"
